server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container (docker-compose service name "backend").
    # Mirrors the dev-time proxy configured in vite.config.ts.
    location /api/ {
        proxy_pass http://backend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let the React router handle unknown paths instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
